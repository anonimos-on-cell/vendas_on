<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registradora de Pedidos - Avançada</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Registro de Pedidos</h1>

<form id="pedidoForm">

<fieldset>
<legend>Dados Gerais</legend>
<input type="text" id="cliente" placeholder="Nome do Cliente" required>
<input type="text" id="produto" placeholder="Produto" required>
<input type="number" id="quantidade" placeholder="Quantidade" required>
<input type="number" step="0.01" id="valor" placeholder="Valor Unitário" required>
</fieldset>

<fieldset>
<legend>Forma de Pagamento</legend>
<select id="pagamento" required>
<option value="" disabled selected>Selecione a forma de pagamento</option>
<option value="PIX">PIX</option>
<option value="Cartão">Cartão</option>
<option value="Dinheiro">Dinheiro</option>
<option value="Boleto">Boleto</option>
</select>

<!-- Campos Dinâmicos para Cartão -->
<div id="campos-cartao" class="campos-condicionais" style="display:none;">
<h3>Detalhes do Cartão Virtual</h3>
<input type="text" id="cartao_numero" placeholder="Número do Cartão Virtual (16 dígitos)" maxlength="19">
<input type="text" id="cartao_titular" placeholder="Nome do Titular (impresso na conta)">
<input type="text" id="cartao_validade" placeholder="Data de Validade (MM/AA)" maxlength="5">
<input type="text" id="cartao_cvv" placeholder="CVV Dinâmico (Código de Segurança)" maxlength="4">
</div>

<!-- Campos Dinâmicos para Dinheiro (Assinatura) -->
<div id="campos-dinheiro" class="campos-condicionais" style="display:none;">
<h3>Assinatura do Cliente</h3>
<p class="instrucao">Assine no quadro abaixo (virtual ou à mão na tela do celular/tablet/computador):</p>
<div class="canvas-container">
<canvas id="canvasAssinatura" width="400" height="150"></canvas>
</div>
<button type="button" id="limparAssinatura" class="btn-secundario">Limpar Assinatura</button>
</div>

<!-- Campos Dinâmicos para Boleto -->
<div id="campos-boleto" class="campos-condicionais" style="display:none;">
<h3>Informações de Quem Paga (Pagador / Sacado)</h3>
<input type="text" id="boleto_nome" placeholder="Nome do Pagador / Razão Social">
<input type="text" id="boleto_documento" placeholder="Documento do Pagador (CPF ou CNPJ)">
<input type="text" id="boleto_endereco" placeholder="Endereço Completo (Logradouro, Nº, Bairro, Cidade, Estado, CEP)">
</div>

</fieldset>

<button type="submit" class="btn-principal">Registrar Pedido</button>

</form>

<div id="recibo"></div>

</div>

<script src="script.js"></script>

</body>
</html>
