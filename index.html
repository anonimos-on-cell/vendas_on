<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="container">
<div class="brand-header">
    <h1>Registro de Pedidos</h1>
    <p>Preencha os dados e escolha a melhor opção de pagamento</p>
</div>

<form id="pedidoForm">
<!-- 1. DADOS DO PEDIDO -->
<fieldset>
<legend>Dados do Pedido (Obrigatórios)</legend>
<!-- Inputs de texto com limite máximo de 100 caracteres -->
<input type="text" id="cliente" class="input-somente-texto" maxlength="100" placeholder="Nome Completo do Cliente (Máx. 100 caracteres)" required>
<input type="text" id="produto" class="input-somente-texto" maxlength="100" placeholder="Descrição do Produto / Serviço (Máx. 100 caracteres)" required>
<input type="number" id="quantidade" class="input-somente-numero" placeholder="Quantidade (Somente números)" min="1" required>
<input type="number" step="0.01" id="valor" class="input-somente-numero" placeholder="Valor Unitário R$ (Somente números)" required>
</fieldset>

<!-- 2. FORMA DE PAGAMENTO E CAMPOS ESPECÍFICOS -->
<fieldset>
<legend>Forma de Pagamento</legend>
<select id="pagamento" required>
<option value="" disabled selected>Escolha a forma de pagamento...</option>
<option value="PIX">PIX (Instantâneo e Seguro)</option>
<option value="Cartão">Cartão de Crédito / Débito</option>
<option value="Boleto">Boleto Bancário</option>
</select>

<div id="campos-cartao" class="campos-condicionais" style="display:none;">
<input type="text" id="cartao_numero" class="input-somente-numero" placeholder="Número do Cartão Virtual (Somente números)">
<input type="text" id="cartao_titular" class="input-somente-texto" maxlength="100" placeholder="Nome do Titular do Cartão (Máx. 100 caracteres)">
<input type="text" id="cartao_validade" placeholder="MM/AA">
<input type="text" id="cartao_cvv" class="input-somente-numero" placeholder="CVV (Somente números)">
</div>

<div id="campos-boleto" class="campos-condicionais" style="display:none;">
<h3 style="font-size:13px; margin-top:12px; color:#4a5568;">Informações do Pagador (Sacado):</h3>
<input type="text" id="boleto_nome" class="input-somente-texto" maxlength="100" placeholder="Nome / Razão Social do Pagador (Máx. 100 caracteres)">
<input type="text" id="boleto_documento" class="input-somente-numero" placeholder="CPF ou CNPJ do Pagador (Somente números)">
<input type="text" id="boleto_endereco" placeholder="Endereço Completo">
</div>
</fieldset>

<!-- 3. ASSINATURA E CONFIRMAÇÃO DA PARTE DE CIMA DA PÁGINA -->
<fieldset id="bloco-assinatura-form">
<legend>Assinatura de Confirmação do Cliente</legend>
<p style="font-size:13px; color:#4a5568; margin-bottom:8px;">
    Assine dentro do quadro abaixo para validar o pedido antes de finalizar:
</p>
<div class="canvas-container">
    <canvas id="canvasAssinatura" width="400" height="150"></canvas>
</div>
<button type="button" id="limparAssinatura" class="btn-secundario" style="margin-top:8px;">Limpar Assinatura</button>
</fieldset>

<button type="submit" class="btn-principal">Finalizar e Gerar Comprovante</button>
</form>

<div id="recibo" style="display:none;"></div>
</div>

<script src="script.js"></script>
</body>
</html>
