<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registradora de Pedidos</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="container">
<h1>Registro de Pedidos</h1>
<form id="pedidoForm">
<fieldset>
<legend>Dados Gerais do Pedido</legend>
<input type="text" id="cliente" placeholder="Nome do Cliente" required>
<input type="text" id="produto" placeholder="Produto" required>
<input type="number" id="quantidade" placeholder="Quantidade" required>
<input type="number" step="0.01" id="valor" placeholder="Valor Unitário (R$)" required>
</fieldset>
<fieldset>
<legend>Forma de Pagamento</legend>
<select id="pagamento" required>
<option value="" disabled selected>Selecione a forma de pagamento</option>
<option value="PIX">PIX</option>
<option value="Cartão">Cartão</option>
<option value="Dinheiro">Dinheiro</option>
<option value="Boleto">Boleto</option>
</select>

<div id="campos-cartao" class="campos-condicionais" style="display:none;">
<input type="text" id="cartao_numero" placeholder="Número do Cartão Virtual">
<input type="text" id="cartao_titular" placeholder="Nome do Titular">
<input type="text" id="cartao_validade" placeholder="MM/AA">
<input type="text" id="cartao_cvv" placeholder="CVV">
</div>

<div id="campos-dinheiro" class="campos-condicionais" style="display:none;">
<canvas id="canvasAssinatura" width="400" height="150"></canvas>
<button type="button" id="limparAssinatura" class="btn-secundario">Limpar Assinatura</button>
</div>
</fieldset>
<button type="submit" class="btn-principal">Registrar Pedido</button>
</form>
<div id="recibo" style="display:none;"></div>
</div>
<script src="script.js"></script>
</body>
</html>
